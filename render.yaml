services:
  - type: web
    name: new-lm-pages-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ENABLE_SCHEDULERS
        value: "false"
      - key: CORS_ORIGINS
        value: "https://new-lm-pages.onrender.com,https://mosesmg255-jpg.github.io"
    healthCheckPath: /health

  # Static Site (optional - for HTML files)
  - type: site
    name: new-lm-pages-static
    plan: free
    buildCommand: npm install
    publishDir: .
    envVars:
      - key: NODE_ENV
        value: production