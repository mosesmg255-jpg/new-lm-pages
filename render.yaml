services:
  # Web Service
  - type: web
    name: new-lm-pages-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server-simple.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_EMAIL
        value: admin@eldorethama.com
      - key: ADMIN_PASSWORD
        value: admin123
    healthCheckPath: /health
    autoDeploy: true

  # Static Site (optional - for HTML files)
  - type: site
    name: new-lm-pages-static
    plan: free
    buildCommand: npm install
    publishDir: .
    envVars:
      - key: NODE_ENV
        value: production